services:
  f-doc:
    build: .
    depends_on:
      - db
      - redis
    environment:
      APP_URL: 'http://localhost:3000'
      APP_SECRET: '3a3d88225a5ee7886a168434b9bdc0ff2508a1aace1232f1c5f32dc79bda5860'
      DATABASE_URL: 'postgresql://f-doc:9be5e2f9423532b81fe93ac3492964fb@db:5432/f-doc'
      REDIS_URL: 'redis://redis:6379'
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - f-doc:/app/data/storage

  db:
    image: postgres:18
    environment:
      POSTGRES_DB: f-doc
      POSTGRES_USER: f-doc
      POSTGRES_PASSWORD: 9be5e2f9423532b81fe93ac3492964fb
    restart: unless-stopped
    volumes:
      - db_data:/var/lib/postgresql

  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  f-doc:
  db_data:
  redis_data:
