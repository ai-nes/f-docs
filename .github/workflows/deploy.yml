name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  DEPLOY_PATH: /home/oral/f-doc
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BUILD_APP_ID }}
          private-key: ${{ secrets.BUILD_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: f-doc:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image
        run: docker save "f-doc:${IMAGE_TAG}" | gzip -1 > f-doc-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: f-doc-image
          path: f-doc-image.tar.gz
          retention-days: 3

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.prod.yml

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: f-doc-image

      - name: Activate release
        run: |
          set -euo pipefail
          test -d "$DEPLOY_PATH"
          test -f "$DEPLOY_PATH/.env.prod" || { echo '.env.prod is missing on server'; exit 1; }
          cp docker-compose.prod.yml "$DEPLOY_PATH/docker-compose.prod.yml"
          gzip -dc "$GITHUB_WORKSPACE/f-doc-image.tar.gz" | docker load
          cd "$DEPLOY_PATH"
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d db redis
          docker compose --env-file .env.prod -f docker-compose.prod.yml run --rm --no-deps f-doc pnpm --filter server run migration:latest:prod
          docker compose --env-file .env.prod -f docker-compose.prod.yml up -d f-doc
          rm -f "$GITHUB_WORKSPACE/f-doc-image.tar.gz"
          docker image prune -f
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health/live
